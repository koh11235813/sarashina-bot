[project]
name = "sarashina-bot"
version = "0.1.0"
description = "Discord bot backed by the Sarashina API"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "discord.py",
    "httpx",
    "pymupdf>=2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
